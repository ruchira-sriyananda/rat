<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download File</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .card{
      background:#ffffff10;
      backdrop-filter:blur(10px);
      padding:40px;
      border-radius:20px;
      width:90%;
      max-width:420px;
      text-align:center;
      border:1px solid #ffffff20;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .logo{
      width:80px;
      height:80px;
      margin:0 auto 20px;
      border-radius:20px;
      background:#2563eb;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:38px;
      font-weight:bold;
    }

    h1{
      margin-bottom:10px;
      font-size:28px;
    }

    p{
      color:#cbd5e1;
      margin-bottom:30px;
      line-height:1.5;
    }

    .download-btn{
      display:inline-block;
      text-decoration:none;
      background:#2563eb;
      color:white;
      padding:15px 30px;
      border-radius:12px;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
    }

    .download-btn:hover{
      background:#1d4ed8;
      transform:translateY(-2px);
    }

    .footer{
      margin-top:25px;
      font-size:13px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">↓</div>

    <h1>Download File</h1>

    <p>
      Click the button below to securely download your file.
    </p>

    <a class="download-btn" href="https://drive.google.com/file/d/1nJZoWMlpKVJZv7awSVylH2ZBlOMheQjA/view?usp=sharing" download>
      Download Now
    </a>

    <div class="footer">
      Secure file delivery
    </div>
  </div>

</body>
</html>
